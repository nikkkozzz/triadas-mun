<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle fretboard frame -->
  <rect x="96" y="136" width="320" height="240" rx="22" fill="#141416" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>
  <!-- Fret vertical wires -->
  <line x1="202" y1="138" x2="202" y2="374" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
  <line x1="310" y1="138" x2="310" y2="374" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
  <!-- 3 Guitar strings -->
  <line x1="98" y1="186" x2="414" y2="186" stroke="#ffffff" stroke-opacity="0.38" stroke-width="5"/>
  <line x1="98" y1="256" x2="414" y2="256" stroke="#ffffff" stroke-opacity="0.46" stroke-width="7"/>
  <line x1="98" y1="326" x2="414" y2="326" stroke="#ffffff" stroke-opacity="0.56" stroke-width="9"/>
  <!-- Major Triad Dots (1 red root, 3 and 5 crisp white) -->
  <circle cx="362" cy="326" r="36" fill="#ff3b30"/>
  <circle cx="256" cy="256" r="34" fill="#f5f5f7"/>
  <circle cx="150" cy="186" r="34" fill="#0a84ff"/>
  <!-- Minimal degree numerals -->
  <text x="362" y="340" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="40">1</text>
  <text x="256" y="270" text-anchor="middle" fill="#0d0d0f" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38">3</text>
  <text x="150" y="200" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38">5</text>
</svg>
